    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does TenderMaster AI do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TenderMaster AI analyses Indian government tender documents — checking eligibility, extracting the Bill of Quantities (BOQ), calculating bid pricing, and generating submission-ready documents including auto-filled annexures."
          }
        },
        {
          "@type": "Question",
          "name": "What is BOQ pricing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BOQ (Bill of Quantities) pricing means pricing every item in a tender's schedule to arrive at a total bid amount. TenderMaster AI's Universal BOQ Engine automatically detects the schedule format — Percentage Rate, Item Rate, or Lump Sum/EPC — extracts it, and gives you a bid calculator to price it."
          }
        },
        {
          "@type": "Question",
          "name": "Does TenderMaster AI support GeM, CPPP and nProcure tenders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. TenderMaster AI works with tenders from GeM (Government e-Marketplace), CPPP (Central Public Procurement Portal), nProcure and other Indian e-procurement portals — upload a document, a ZIP of documents, or a portal link."
          }
        },
        {
          "@type": "Question",
          "name": "What languages does TenderMaster AI support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "English, Hindi and Gujarati — analysis results and generated documents are available in all three."
          }

          "@type": "Question",
          "name": "Does TenderMaster AI generate bid documents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The AI Document Generator produces submission-ready documents — company profile, EMD declaration, technical bid content and more — and auto-fills the exact annexure form issued by the tender department."
          }
        },
        {
          "@type": "Question",
          "name": "Does TenderMaster AI track EMD and Security Deposit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every EMD and Security Deposit payment is tracked through Paid → Pending Refund → Refunded, so nothing gets forgotten."
          }
        }
      ]
    }
